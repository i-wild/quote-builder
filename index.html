<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Soluciones Digitales Empresariales — Acumatica ERP consulting, support, configuration, reporting, automation, data migration and business process consulting.">
<meta name="keywords" content="Acumatica, Acumatica ERP, Acumatica Consultant, Acumatica Support, Acumatica Functional Consultant, Acumatica Distribution, Acumatica Inventory, Acumatica Purchasing, Acumatica Sales, Acumatica Generic Inquiry, Acumatica Business Events, Acumatica Import Scenarios, Acumatica Data Migration, Acumatica Reports, consultoría Acumatica, soporte Acumatica, inventarios Acumatica, compras Acumatica, ventas Acumatica">

<meta property="og:description" content="Acumatica ERP consulting, support, configuration, reporting, automation and data migration.">

<title>Soluciones Digitales Empresariales — Acumatica ERP</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#12161B; --surface:#1B2129; --surface-2:#232B34; --line:#333E4A;
  --cyan:#5CC8E8; --amber:#E8A23D; --text:#E9EDF0; --muted:#8B96A3; --good:#6FCF97;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(var(--ink),var(--ink)),
    repeating-linear-gradient(0deg, rgba(92,200,232,0.045) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(92,200,232,0.045) 0 1px, transparent 1px 28px);
  color:var(--text); font-family:'IBM Plex Sans',sans-serif; min-height:100vh; padding:32px 20px 80px;
}
.wrap{max-width:1080px;margin:0 auto;position:relative;}
header{margin-bottom:22px;padding-right:80px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:10px;}
.eyebrow::before{content:"";width:18px;height:1px;background:var(--cyan);display:inline-block;}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,4vw,38px);font-weight:700;margin:10px 0 8px;letter-spacing:-0.01em;}
.sub{color:var(--muted);font-size:15px;max-width:760px;line-height:1.55;}
h2{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--cyan);text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px;}

.langSwitch{position:absolute;top:0;right:0;display:flex;gap:6px;}
.langSwitch button{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 9px;border-radius:3px;cursor:pointer;}
.langSwitch button.active{color:var(--cyan);border-color:var(--cyan);}

.info-nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 20px;}
.nav-btn{background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;}
.nav-btn:hover{border-color:var(--cyan);color:var(--cyan);}

.info-panel{display:none;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px;margin-bottom:20px;}
.info-panel.open{display:block;}
.info-panel p{font-size:14px;line-height:1.6;color:var(--text);margin:0 0 10px;}
.info-panel p:last-child{margin-bottom:0;}
.cert-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.cert-badge{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:5px 10px;color:var(--cyan);}
.cert-note{font-size:12.5px;color:var(--muted);margin-top:12px;}

.gate{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:20px;}
.gate-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin-bottom:4px;}
.gate-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
.gate-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:560px){.gate-row{grid-template-columns:1fr;}}
.gate-row input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:11px 14px;}
.gate-row input.invalid{border-color:#E86A5C;}
.gate-err{font-size:11.5px;color:#E86A5C;margin-top:6px;min-height:14px;}

.grid{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start;}
@media (max-width:860px){.grid{grid-template-columns:1fr;}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 22px 24px;margin-bottom:20px;position:relative;}
.step-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink);background:var(--cyan);width:24px;height:24px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;margin-right:10px;}
.step-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;display:flex;align-items:center;margin-bottom:16px;}
.step-title .opt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-left:auto;font-weight:400;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.card{border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:14px;cursor:pointer;transition:border-color .15s, background .15s;}
.card:hover{border-color:var(--cyan);}
.card.active{border-color:var(--cyan);background:linear-gradient(180deg, rgba(92,200,232,0.14), rgba(92,200,232,0.04));}
.card-name{font-weight:600;font-size:14px;margin-bottom:4px;}
.card-hint{font-size:12.5px;color:var(--muted);line-height:1.35;}
.sub-list{display:flex;flex-direction:column;gap:8px;}
.sub-item{border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:border-color .15s, background .15s;}
.sub-item:hover{border-color:var(--cyan);}
.sub-item.active{border-color:var(--cyan);background:linear-gradient(180deg, rgba(92,200,232,0.14), rgba(92,200,232,0.04));}
.sub-item .label{font-size:14px;}
.sub-item .pkg{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;}
.placeholder{color:var(--muted);font-size:13.5px;font-style:italic;}
.priority-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (max-width:560px){.priority-row{grid-template-columns:1fr;}}
.prio{border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:14px;text-align:center;cursor:pointer;transition:border-color .15s, background .15s;}
.prio:hover{border-color:var(--amber);}
.prio.active{border-color:var(--amber);background:linear-gradient(180deg, rgba(232,162,61,0.16), rgba(232,162,61,0.04));}
.prio .p-name{font-weight:600;font-size:13.5px;}
.prio .p-time{font-size:11.5px;color:var(--muted);margin-top:2px;}
.prio .p-sur{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber);margin-top:6px;}

textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:12px 14px;resize:vertical;min-height:90px;}
textarea:focus, input:focus, .card:focus-visible, .sub-item:focus-visible, .prio:focus-visible{outline:2px solid var(--cyan);outline-offset:1px;}
.counter{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-align:right;margin-top:6px;}
.freeform-fields{display:flex;flex-direction:column;gap:10px;}
.freeform-fields input,.freeform-fields textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:11px 14px;}
.freeform-fields textarea{min-height:80px;resize:vertical;}
.freeform-fields label{font-size:12px;color:var(--muted);margin-bottom:-4px;}

.ticket-wrap{position:sticky;top:24px;}
.ticket{background:var(--surface);border:1px dashed var(--cyan);border-radius:6px;padding:22px 20px;position:relative;overflow:hidden;}
.ticket::before{content:attr(data-stamp);position:absolute;top:14px;right:-32px;background:var(--amber);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;padding:3px 38px;transform:rotate(30deg);}
.t-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
.t-cat{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px;margin:4px 0 2px;}
.t-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}
.t-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid var(--line);gap:14px;}
.t-row span:first-child{color:var(--muted);}
.t-price{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;}
.t-price .amt{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--good);transition:opacity .15s;}
.flash{animation:flash .4s ease;}
@keyframes flash{0%{opacity:.25;}100%{opacity:1;}}
.t-includes{font-size:12px;color:var(--cyan);margin-top:10px;line-height:1.5;}
.disclaimer{border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:14px 16px;margin-top:10px;font-size:12px;line-height:1.5;color:var(--muted);}
.disclaimer strong{color:var(--text);}
.platform-note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4;}
.warn{display:none;margin-top:10px;padding:10px 12px;border:1px solid var(--amber);background:rgba(232,162,61,0.1);border-radius:4px;font-size:12px;color:var(--amber);line-height:1.4;}
.warn.show{display:block;}
.action-btn{width:100%;background:var(--cyan);color:var(--ink);border:none;border-radius:4px;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.03em;cursor:pointer;}
.action-btn:hover{filter:brightness(1.08);}
.action-btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);margin-top:8px;}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.4;}

.quote-disclaimer{display:none;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px;margin-top:28px;}
.quote-disclaimer.show{display:block;}
.quote-disclaimer p{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 0 10px;}
.quote-disclaimer p:last-child{margin-bottom:0;}

.terms-box{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px;margin-top:28px;}
.terms-box ol{font-size:13.5px;line-height:1.7;color:var(--text);padding-left:20px;margin:0;}
.terms-box li{margin-bottom:8px;}
.hidden-netlify{position:absolute;left:-9999px;opacity:0;pointer-events:none;}
</style>
</head>

<body>
<div class="wrap">

  <div class="langSwitch">
    <button id="lb-es" onclick="setLang('es')">ES</button>
    <button id="lb-en" onclick="setLang('en')">EN</button>
  </div>

  <header>
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="h1"></h1>
    <p class="sub" data-i18n="sub1"></p>
  </header>

  <div class="info-nav">
    <button class="nav-btn" onclick="togglePanel('welcomePanel')" data-i18n="welcomeNav"></button>
    <button class="nav-btn" onclick="togglePanel('aboutPanel')" data-i18n="aboutNav"></button>
    <button class="nav-btn" onclick="togglePanel('certPanel')" data-i18n="certNav"></button>
  </div>

  <section class="info-panel" id="welcomePanel">
    <h2 data-i18n="welcomeTitle"></h2>
    <p data-i18n="welcomeBody"></p>
  </section>

  <section class="info-panel" id="aboutPanel">
    <h2 data-i18n="aboutTitle"></h2>
    <p data-i18n="aboutBody"></p>
  </section>

  <section class="info-panel" id="certPanel">
    <h2 data-i18n="certTitle"></h2>
    <div class="cert-grid" id="certGrid"></div>
    <div class="cert-note" data-i18n="certNote"></div>
  </section>

  <div class="gate">
    <div class="gate-title" data-i18n="gateTitle"></div>
    <div class="gate-sub" data-i18n="gateSub"></div>
    <div class="gate-row">
      <div><input type="text" id="g-name" data-i18n-ph="namePh" autocomplete="name"></div>
      <div><input type="email" id="g-email" data-i18n-ph="emailPh" autocomplete="email"></div>
    </div>
    <div class="gate-err" id="g-err"></div>
  </div>

  <div class="grid locked" id="mainGrid">
    <div>
      <div class="step">
        <div class="step-title"><span class="step-num">1</span><span data-i18n="step1Title"></span><span class="opt" data-i18n="step1Opt"></span></div>
        <div class="cards" id="categories"></div>
      </div>

      <div class="step">
        <div class="step-title"><span class="step-num">2</span><span data-i18n="step2Title"></span><span class="opt" id="sub-count"></span></div>
        <div class="sub-list" id="subtopics"></div>
      </div>

      <div class="step">
        <div class="step-title"><span class="step-num">3</span><span data-i18n="step3Title"></span><span class="opt" data-i18n="step3Opt"></span></div>
        <div class="priority-row" id="priorities"></div>
        <div class="warn" id="rushWarn" data-i18n="rushWarn"></div>
      </div>

      <div class="step">
        <div class="step-title"><span class="step-num">4</span><span data-i18n="step4Title"></span></div>
        <textarea id="desc" maxlength="1500" data-i18n-ph="descPh"></textarea>
        <div class="counter"><span id="charcount">0</span>/1500</div>
      </div>
    </div>

    <div class="ticket-wrap">
      <div class="ticket" data-stamp="QUOTE">
        <div class="t-label" data-i18n="t-label-pkg"></div>
        <div class="t-cat" id="t-cat">—</div>
        <div class="t-sub" id="t-sub"></div>

        <div class="t-row"><span data-i18n="t-topic-lbl"></span><span id="t-topic">—</span></div>
        <div class="t-row"><span data-i18n="t-turn-lbl"></span><span id="t-turn">—</span></div>

        <div class="t-price">
          <span class="t-label" data-i18n="t-price-lbl"></span>
          <span class="amt" id="t-price">—</span>
        </div>

        <div class="t-includes" id="t-includes"></div>
        <div class="disclaimer" id="ticketDisclaimer"></div>
        <div class="platform-note" data-i18n="platformNote"></div>

        <button class="action-btn" id="emailBtn" data-i18n="sendBtn"></button>
        <button class="action-btn secondary" id="copyBtn" data-i18n="copyBtn"></button>
        <div class="note" data-i18n="sendNote"></div>
      </div>
    </div>
  </div>

  <section class="quote-disclaimer" id="quoteDisclaimer">
    <h2 data-i18n="quoteDisclaimerTitle"></h2>
    <div id="quoteDisclaimerText"></div>
  </section>

  <section class="terms-box">
    <h2 data-i18n="termsTitle"></h2>
    <ol id="termsList"></ol>
    <button class="action-btn secondary" id="copyTermsBtn" data-i18n="copyTermsBtn" style="margin-top:16px;"></button>
  </section>

  <!-- Netlify Forms endpoint: submissions can be configured in Netlify to notify
       soluciones.digitales.empresariales@outlook.com. -->
  <form name="quote-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" class="hidden-netlify">
    <input type="hidden" name="form-name" value="quote-request">
    <input name="bot-field">
    <input type="hidden" name="quote-data" id="netlifyQuoteData">
  </form>

</div>

const PRIORITIES = [
  {id:'standard',es:'3+ semanas / sin prisa',en:'3+ weeks / no rush',turn_es:'4–6 días hábiles',turn_en:'4–6 business days',mult:1.0,tag:'—'},
  {id:'priority',es:'Dentro de 2 semanas',en:'Within 2 weeks',turn_es:'3–4 días hábiles',turn_en:'3–4 business days',mult:1.25,tag:'+25%'},
  {id:'rush',es:'Dentro de 1 semana',en:'Within 1 week',turn_es:'2 días hábiles',turn_en:'2 business days',mult:1.5,tag:'+50%'}
];

const CERTS = ['F340','F330','F320','F300','F230','F130','F100','F050','C100','D300','D210','D200','D100'];
let state={cat:null,sub:null,prio:'standard'};

function t(key){return I18N[lang][key];}

function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.getElementById('lb-es').classList.toggle('active',l==='es');
  document.getElementById('lb-en').classList.toggle('active',l==='en');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  buildCerts(); buildCategories(); buildPriorities(); buildTerms(); renderSubs(); updateTicket();
  document.getElementById('ticketDisclaimer').innerHTML=t('scopeDisclaimer');
  document.getElementById('quoteDisclaimerText').innerHTML=t('termsItems').map(x=>`<p>• ${x}</p>`).join('');
  checkGate();
}

function togglePanel(id){
  document.querySelectorAll('.info-panel').forEach(p=>{if(p.id!==id)p.classList.remove('open');});
  document.getElementById(id).classList.toggle('open');
}

function buildCerts(){
  document.getElementById('certGrid').innerHTML=CERTS.map(c=>`<span class="cert-badge">${c}</span>`).join('');
}

function buildCategories(){
  const el=document.getElementById('categories'); el.innerHTML='';
  DATA.forEach(cat=>{
    const d=document.createElement('div');
    d.className='card'+(state.cat===cat.id?' active':'');
    d.tabIndex=0;
    d.innerHTML=`<div class="card-name">${cat[lang].name}</div><div class="card-hint">${cat[lang].hint}</div>`;
    d.onclick=()=>selectCategory(cat.id);
    d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectCategory(cat.id);}};
    d.dataset.id=cat.id; el.appendChild(d);
  });
}

function buildPriorities(){
  const el=document.getElementById('priorities'); el.innerHTML='';
  PRIORITIES.forEach(p=>{
    const d=document.createElement('div');
    d.className='prio'+(p.id===state.prio?' active':'');
    d.tabIndex=0;
    d.innerHTML=`<div class="p-name">${p[lang]}</div><div class="p-time">${lang==='es'?p.turn_es:p.turn_en}</div><div class="p-sur">${p.tag}</div>`;
    d.onclick=()=>selectPriority(p.id);
    d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPriority(p.id);}};
    d.dataset.id=p.id; el.appendChild(d);
  });
}

function buildTerms(){
  document.getElementById('termsList').innerHTML=t('termsItems').map(li=>`<li>${li}</li>`).join('');
}

function selectCategory(id){
  state.cat=id; state.sub=null;
  [...document.getElementById('categories').children].forEach(c=>c.classList.toggle('active',c.dataset.id===id));
  renderSubs(); updateTicket();
}

function renderSubs(){
  const el=document.getElementById('subtopics');
  const cat=DATA.find(c=>c.id===state.cat);
  el.innerHTML='';
  document.getElementById('sub-count').textContent=cat&&cat.subs?t('optionsLabel')(cat.subs.length):'';
  if(!cat){el.innerHTML=`<div class="placeholder">${t('selectTopicFirst')}</div>`;return;}
  if(cat.isFreeform){
    el.innerHTML=`<div class="freeform-fields">
      <label for="ff-need">${t('ffNeedLabel')}</label>
      <input type="text" id="ff-need" maxlength="120" placeholder="${t('ffNeedPh')}">
      <label for="ff-detail">${t('ffDetailLabel')}</label>
      <textarea id="ff-detail" maxlength="1200" placeholder="${t('ffDetailPh')}"></textarea>
    </div>`;
    document.getElementById('ff-need').addEventListener('input',updateTicket);
    document.getElementById('ff-detail').addEventListener('input',updateTicket);
    return;
  }
  cat.subs.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='sub-item'+(state.sub===i?' active':'');
    d.tabIndex=0;
    d.innerHTML=`<span class="label">${s[lang]}</span><span class="pkg">${s.pkg}</span>`;
    const choose=()=>{state.sub=i;[...el.children].forEach(x=>x.classList.remove('active'));d.classList.add('active');updateTicket();};
    d.onclick=choose;
    d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}};
    el.appendChild(d);
  });
}

function selectPriority(id){
  state.prio=id;
  [...document.getElementById('priorities').children].forEach(c=>c.classList.toggle('active',c.dataset.id===id));
  updateTicket();
}

function includesFor(pkg){
  if(pkg==='Diagnostic')return '';
  if(pkg==='Functional Solution'||pkg==='Advanced Solution')return t('includesCheatsheet')+t('includesVideo');
  return t('includesCheatsheet');
}

function updateTicket(){
  const cat=DATA.find(c=>c.id===state.cat);
  const sub=cat&&!cat.isFreeform&&state.sub!==null?cat.subs[state.sub]:null;
  const prio=PRIORITIES.find(p=>p.id===state.prio);
  document.getElementById('t-topic').textContent=cat?cat[lang].name:'—';
  document.getElementById('t-turn').textContent=lang==='es'?prio.turn_es:prio.turn_en;
  document.getElementById('rushWarn').classList.toggle('show',state.prio==='rush');

  const priceEl=document.getElementById('t-price');
  const catEl=document.getElementById('t-cat');
  const subEl=document.getElementById('t-sub');
  const incEl=document.getElementById('t-includes');
  const ffNeed=document.getElementById('ff-need');
  const ffHasContent=cat&&cat.isFreeform&&ffNeed&&ffNeed.value.trim().length>0;

  if(sub){
    const total=Math.round(sub.price*prio.mult/5)*5;
    catEl.textContent=sub.pkg; subEl.textContent=sub[lang]; priceEl.textContent=`$${total} USD`; incEl.textContent=includesFor(sub.pkg);
  }else if(ffHasContent){
    catEl.textContent=t('customRequest'); subEl.textContent=ffNeed.value.trim(); priceEl.textContent=t('quotedAfterReview'); incEl.textContent='';
  }else{
    catEl.textContent='—'; subEl.textContent=cat?(cat.isFreeform?t('describeNeedAbove'):t('selectNeedAbove')):t('selectTopicToBegin'); priceEl.textContent='—'; incEl.textContent='';
  }
  priceEl.classList.remove('flash'); void priceEl.offsetWidth; priceEl.classList.add('flash');
}

const desc=document.getElementById('desc');
desc.addEventListener('input',()=>document.getElementById('charcount').textContent=desc.value.length);

const gName=document.getElementById('g-name');
const gEmail=document.getElementById('g-email');
const gErr=document.getElementById('g-err');
const mainGrid=document.getElementById('mainGrid');
const emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function checkGate(){
  const nameOk=gName.value.trim().length>1;
  const emailOk=emailRe.test(gEmail.value.trim());
  gEmail.classList.toggle('invalid',gEmail.value.length>0&&!emailOk);
  const unlocked=nameOk&&emailOk;
  mainGrid.classList.toggle('locked',!unlocked);
  gErr.textContent=unlocked?'':(gEmail.value.length>0&&!emailOk?t('invalidEmail'):'');
  return unlocked;
}
gName.addEventListener('input',checkGate);
gEmail.addEventListener('input',checkGate);

function buildQuoteObject(){
  const cat=DATA.find(c=>c.id===state.cat);
  const sub=cat&&!cat.isFreeform&&state.sub!==null?cat.subs[state.sub]:null;
  const prio=PRIORITIES.find(p=>p.id===state.prio);
  const ffNeed=document.getElementById('ff-need');
  const ffDetail=document.getElementById('ff-detail');
  const priceTxt=document.getElementById('t-price').textContent;
  const turnTxt=lang==='es'?prio.turn_es:prio.turn_en;

  return {
    company:'Soluciones Digitales Empresariales',
    service:'Acumatica ERP Consulting',
    date:new Date().toLocaleDateString(lang==='es'?'es-MX':'en-US'),
    client:gName.value.trim(),
    email:gEmail.value.trim(),
    topic:cat?cat[lang].name:'(not selected)',
    need:cat&&cat.isFreeform?(ffNeed?.value.trim()||'(not provided)'):(sub?sub[lang]:'(not selected)'),
    detail:cat&&cat.isFreeform?(ffDetail?.value.trim()||'(not provided)'):(desc.value.trim()||'(not provided)'),
    package:sub?sub.pkg:(cat&&cat.isFreeform?t('customRequest'):'—'),
    priority:lang==='es'?prio.es:prio.en,
    delivery:turnTxt,
    baseRate:priceTxt,
    description:desc.value.trim()||'(not provided)',
    disclaimer:t('scopeDisclaimer').replace(/<[^>]*>/g,''),
    terms:t('termsItems')
  };
}

function buildEmailBody(q){
  return [
    'SOLUCIONES DIGITALES EMPRESARIALES — ACUMATICA ERP',
    '================================================',
    `Fecha: ${q.date}`,
    `Cliente: ${q.client}`,
    `Correo: ${q.email}`,
    '',
    `Tema: ${q.topic}`,
    `Necesidad: ${q.need}`,
    `Paquete: ${q.package}`,
    `Prioridad: ${q.priority}`,
    `Entrega estimada: ${q.delivery}`,
    `Tarifa base: ${q.baseRate}`,
    '',
    'Descripción:',
    q.description,
    '',
    'DISCLAIMER DE COTIZACIÓN',
    '------------------------',
    q.disclaimer,
    '',
    'CONDICIONES',
    '-----------',
    ...q.terms.map((x,i)=>`${i+1}. ${x}`),
    '',
    'Solicitud generada desde Soluciones Digitales Empresariales.'
  ].join('\n');
}

function buildUpworkText(q){
  return [
    'ACUMATICA PROJECT REQUEST',
    '',
    `Client: ${q.client}`,
    `Email: ${q.email}`,
    `Topic: ${q.topic}`,
    `Specific need: ${q.need}`,
    `Recommended package: ${q.package}`,
    `Priority: ${q.priority}`,
    `Estimated delivery: ${q.delivery}`,
    `Base quote: ${q.baseRate}`,
    '',
    'Project description:',
    q.description,
    '',
    'Scope / quote disclaimer:',
    q.disclaimer,
    '',
    'Terms:',
    ...q.terms.map((x,i)=>`${i+1}. ${x}`)
  ].join('\n');
}

async function submitToNetlify(q){
  const form=document.querySelector('form[name="quote-request"]');
  const data=new URLSearchParams();
  data.append('form-name','quote-request');
  data.append('quote-data',buildEmailBody(q));
  try{
    const response=await fetch('/',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:data.toString()
    });
    return response.ok;
  }catch(e){return false;}
}

document.getElementById('copyBtn').addEventListener('click',async()=>{
  if(!checkGate())return;
  const q=buildQuoteObject();
  const text=buildUpworkText(q);
  try{
    await navigator.clipboard.writeText(text);
    const btn=document.getElementById('copyBtn');
    const orig=btn.textContent;
    btn.textContent=lang==='es'?'Copiado ✓':'Copied ✓';
    setTimeout(()=>btn.textContent=orig,2200);
  }catch(e){
    alert(text);
  }
});

document.getElementById('emailBtn').addEventListener('click',async()=>{
  if(!checkGate())return;
  const q=buildQuoteObject();
  document.getElementById('quoteDisclaimer').classList.add('show');
  document.getElementById('quoteDisclaimerText').innerHTML=t('termsItems').map(x=>`<p>• ${x}</p>`).join('');
  const netlifySent=await submitToNetlify(q);
  const subject=`Acumatica quote — ${q.topic} — ${q.client}`;
  const body=buildEmailBody(q);
  window.location.href=`mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if(!netlifySent){
    setTimeout(()=>alert(t('emailSuccess')),400);
  }
});

document.getElementById('copyTermsBtn').addEventListener('click',async()=>{
  const text=(lang==='es'?'CONDICIONES A CONSIDERAR':'TERMS TO CONSIDER')+'\n'+t('termsItems').map((li,i)=>`${i+1}. ${li}`).join('\n');
  try{
    await navigator.clipboard.writeText(text);
    const btn=document.getElementById('copyTermsBtn');
    const orig=btn.textContent;
    btn.textContent=lang==='es'?'Copiado ✓':'Copied ✓';
    setTimeout(()=>btn.textContent=orig,2200);
  }catch(e){alert(text);}
});

setLang('es');
